name: Refresh ARTC MTP data

on:
  schedule:
    # Every Monday at 06:00 UTC (4pm ACST) — ARTC typically publishes on weekdays
    - cron: "0 6 * * MON"
  workflow_dispatch:
    # Also triggerable manually from the GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated trains.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest ARTC MTP and parse
        run: python fetch_artc.py

      - name: Check if data changed
        id: diff
        run: |
          git diff --quiet data/trains.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated timetable
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trains.json
          git commit -m "chore: refresh ARTC MTP timetable data [skip ci]"
          git push
